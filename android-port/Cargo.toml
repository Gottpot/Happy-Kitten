# Eigener Workspace: Der Android-Port kopiert UI, hk-media und hk-text und benutzt hk-core,
# hk-gpu und hk-audio unverändert aus ../crates. Der Mac-Workspace bleibt davon unberührt.
[workspace]
resolver = "3"
members = ["app", "hk-media", "hk-text", "hk-touch"]

[workspace.package]
# Android hat eine eigene Versionslinie (Mac: siehe Hauptordner).
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["Gottpot"]
description = "Happy-Kitten für Android (Handy und Tablet)"
publish = false

[workspace.dependencies]
hk-core = { path = "../crates/hk-core" }
hk-gpu = { path = "../crates/hk-gpu" }
hk-audio = { path = "../crates/hk-audio" }
hk-media = { path = "hk-media" }
hk-text = { path = "hk-text" }
hk-touch = { path = "hk-touch" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
